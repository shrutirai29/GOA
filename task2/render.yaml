services:
  - type: web
    name: voice-rag
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: STT_PROVIDER
        value: sarvam
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_STT_MODEL
        value: saarika:v2.5
      - key: RERANKER_ENABLED
        value: "false"
      - key: MIN_RETRIEVAL_CONFIDENCE
        value: "0.10"
