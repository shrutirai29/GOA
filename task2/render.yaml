# Render blueprint for the RAG backend (https://render.com/docs/blueprint-spec).
# Before deploying, edit `repo` to your GitHub repo (rootDir = task2 handles
# the monorepo layout).
#
# Requirements (full details in DEPLOY.md):
#  - Plan with >= 1 GB RAM: the embedding model (~470 MB) + ~240 MB of
#    indexes + torch runtime exceed Render's 512 MB free/starter limit.
#  - The knowledge base (data/indexes) is gitignored — commit it, upload it to
#    a Render disk, or build it on first boot before enabling this service.
#  - First boot downloads the embedding model (~470 MB) into /app/models.
services:
  - type: web
    name: rag-backend
    runtime: docker
    repo: https://github.com/YOUR_USER/YOUR_REPO   # TODO: point at your repo
    rootDir: task2
    dockerfilePath: ./Dockerfile
    plan: standard          # >= 1 GB RAM (free/starter 512 MB is too small)
    healthCheckPath: /api/health
    envVars:
      - key: PROJECT_ROOT
        value: /app
      - key: DATA_DIR
        value: /app/data
      - key: INDEX_DIR
        value: /app/data/indexes
      - key: MODEL_CACHE_DIR
        value: /app/models
      - key: LLM_PROVIDER
        value: mock
      - key: STT_PROVIDER
        value: mock
